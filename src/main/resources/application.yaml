spring:
  application:
    name: project_management_system

  config:
    # Load a local .env file (KEY=VALUE format) if present. Env vars set in the
    # shell take precedence. If the file is absent and no env vars are provided,
    # startup will still fail for any unresolved placeholder (intentional).
    import: optional:file:.env[.properties]

  # PostgreSQL datasource
  # You can override these via environment variables DB_URL, DB_USER, DB_PASS
  datasource:
    # Optional: explicit driver (Boot usually detects it)
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  # JPA/Hibernate
  # Explicit dialect avoids "Unable to determine Dialect" during startup
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    web:
      pageable:
        serialization-mode: via-dto

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Feature flags
app:
  auto-create-employee: ${AUTO_CREATE_EMPLOYEE:false}
  # Cookie
  cookie:
    secure: ${COOKIE_SECURE:true}

logging:
  level:
    org.flywaydb: DEBUG
