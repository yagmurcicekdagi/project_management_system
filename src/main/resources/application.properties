spring.application.name=project_management_system

# PostgreSQL datasource
# You can override these via environment variables DB_URL, DB_USER, DB_PASS

# Optional: explicit driver (Boot usually detects it)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
# Explicit dialect avoids "Unable to determine Dialect" during startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.data.web.pageable.serialization-mode=via-dto

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# CORS
cors.allowed-origins=${CORS_ORIGINS}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Feature flags
app.auto-create-employee=${AUTO_CREATE_EMPLOYEE:false}
